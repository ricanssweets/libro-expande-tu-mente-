/* ============================= THEME ============================= */
const THEMES = {
  light: { bg: "#F5EEDC", bg2: "#ECE1C4", ink: "#211A10", inkSoft: "#5B5138", gold: "#B9760F", goldBg: "#DDA525", line: "#D8CBA0" },
  dark:  { bg: "#1B1712", bg2: "#26201A", ink: "#F1E9D8", inkSoft: "#C8BCA0", gold: "#E9BA4E", goldBg: "#E9BA4E", line: "#3B3428" }
};
const FONT_SIZES = { s: 15, m: 17, l: 19, xl: 22 };
const LS_PROGRESS = "expande-reading-progress";
const LS_PREFS = "expande-reading-prefs";
const LS_BOOKMARKS = "expande-bookmarks";

function Icon({ path, size = 16, color = "currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: path }} />;
}
const ICONS = {
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  bookmark: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  bookmarkFilled: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="currentColor"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  chevLeft: '<polyline points="15 18 9 12 15 6"/>',
  chevRight: '<polyline points="9 18 15 12 9 6"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  reset: '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'
};

function App() {
  const [themeName, setThemeName] = useState("light");
  const [fontKey, setFontKey] = useState("m");
  const [chapterIdx, setChapterIdx] = useState(0);
  const [view, setView] = useState("home");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [bookmarks, setBookmarks] = useState([]);
  const [query, setQuery] = useState("");
  const [isDesktop, setIsDesktop] = useState(window.innerWidth > 820);
  const contentRef = useRef(null);
  const scrollSaveTimer = useRef(null);
  const T = THEMES[themeName];

  useEffect(() => {
    try {
      const prog = JSON.parse(localStorage.getItem(LS_PROGRESS) || "null");
      if (prog && typeof prog.chapterIdx === "number") setChapterIdx(prog.chapterIdx);
    } catch (e) {}
    try {
      const prefs = JSON.parse(localStorage.getItem(LS_PREFS) || "null");
      if (prefs) { if (prefs.theme) setThemeName(prefs.theme); if (prefs.font) setFontKey(prefs.font); }
    } catch (e) {}
    try {
      const bm = JSON.parse(localStorage.getItem(LS_BOOKMARKS) || "[]");
      setBookmarks(bm);
    } catch (e) {}
    const onResize = () => setIsDesktop(window.innerWidth > 820);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => { localStorage.setItem(LS_PREFS, JSON.stringify({ theme: themeName, font: fontKey })); }, [themeName, fontKey]);
  useEffect(() => { localStorage.setItem(LS_BOOKMARKS, JSON.stringify(bookmarks)); }, [bookmarks]);

  const saveProgress = useCallback((idx, scrollPct) => {
    localStorage.setItem(LS_PROGRESS, JSON.stringify({ chapterIdx: idx, scrollPct: scrollPct || 0, updatedAt: Date.now() }));
  }, []);

  const goToChapter = (idx) => {
    setChapterIdx(idx); setView("reader"); setSidebarOpen(false); saveProgress(idx, 0);
    setTimeout(() => { if (contentRef.current) contentRef.current.scrollTop = 0; }, 0);
  };

  const onScroll = () => {
    if (!contentRef.current) return;
    const el = contentRef.current;
    const pct = el.scrollHeight > el.clientHeight ? el.scrollTop / (el.scrollHeight - el.clientHeight) : 0;
    if (scrollSaveTimer.current) clearTimeout(scrollSaveTimer.current);
    scrollSaveTimer.current = setTimeout(() => saveProgress(chapterIdx, pct), 400);
  };

  const toggleBookmark = (id) => setBookmarks((b) => (b.includes(id) ? b.filter((x) => x !== id) : [...b, id]));

  const chapter = BOOK[chapterIdx];
  const progressPct = Math.round(((chapterIdx + 1) / BOOK.length) * 100);
  const results = query.trim() ? BOOK.filter((c) => (c.title + " " + (c.subtitle || "") + " " + (c.tag || "")).toLowerCase().includes(query.toLowerCase())) : [];

  const iconBtn = { display: "flex", alignItems: "center", justifyContent: "center", width: 30, height: 30, borderRadius: 8, border: `1px solid ${T.line}`, background: "transparent", color: T.ink, cursor: "pointer" };
  const navRow = (active) => ({ display: "flex", alignItems: "center", width: "100%", padding: "9px 10px", borderRadius: 8, border: "none", background: active ? T.gold + "26" : "transparent", color: T.ink, cursor: "pointer", textAlign: "left", marginBottom: 2 });
  const navBtn = { display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 20, border: `1px solid ${T.line}`, background: "transparent", color: T.ink, fontFamily: "system-ui, sans-serif", fontSize: 12.5, fontWeight: 600, cursor: "pointer" };

  return (
    <div style={{ height: "100vh", width: "100%", background: T.bg, color: T.ink, fontFamily: "'Georgia', 'Iowan Old Style', serif", display: "flex", overflow: "hidden" }}>
      <div style={{
        position: sidebarOpen && !isDesktop ? "fixed" : "relative", zIndex: 40, top: 0, left: 0, height: "100%", width: 280,
        background: T.bg2, borderRight: `1px solid ${T.line}`,
        transform: sidebarOpen || isDesktop ? "translateX(0)" : "translateX(-100%)",
        transition: "transform .25s ease", display: isDesktop ? "flex" : (sidebarOpen ? "flex" : "none"), flexDirection: "column"
      }}>
        <div style={{ padding: "18px 18px 10px 18px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: T.gold }}>Expande Tu Mente</div>
            <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 2 }}>Sistema Memoria Expandida™</div>
          </div>
          {!isDesktop && <button onClick={() => setSidebarOpen(false)} style={iconBtn}><Icon path={ICONS.x} size={16} /></button>}
        </div>
        <div style={{ padding: "0 18px 10px 18px" }}>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 8, top: 7, color: T.inkSoft }}><Icon path={ICONS.search} size={13} /></span>
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar capítulo…"
              style={{ width: "100%", boxSizing: "border-box", padding: "7px 10px 7px 28px", borderRadius: 8, border: `1px solid ${T.line}`, background: T.bg, color: T.ink, fontSize: 12.5, fontFamily: "system-ui, sans-serif" }} />
          </div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: "4px 10px 18px 10px" }}>
          <button onClick={() => setView("home")} style={{ ...navRow(view === "home"), marginBottom: 6 }}>
            <Icon path={ICONS.home} size={13} /> <span style={{ marginLeft: 8 }}>Portada</span>
          </button>
          {(query.trim() ? results : BOOK).map((c) => {
            const idx = BOOK.indexOf(c);
            const active = view === "reader" && idx === chapterIdx;
            return (
              <button key={c.id} onClick={() => goToChapter(idx)} style={navRow(active)}>
                <span style={{ width: 20, fontFamily: "Georgia, serif", fontWeight: 700, color: T.gold, fontSize: 12 }}>{c.num ? String(c.num).padStart(2, "0") : "—"}</span>
                <span style={{ marginLeft: 6, fontSize: 12.5, fontFamily: "system-ui, sans-serif", flex: 1, textAlign: "left" }}>{c.title}</span>
                {bookmarks.includes(c.id) && <Icon path={ICONS.bookmarkFilled} size={12} color={T.gold} />}
              </button>
            );
          })}
        </div>
        <div style={{ padding: "12px 18px", borderTop: `1px solid ${T.line}` }}>
          <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 10, color: T.inkSoft, marginBottom: 6 }}>Progreso general</div>
          <div style={{ height: 5, borderRadius: 3, background: T.line, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${progressPct}%`, background: T.gold, transition: "width .3s" }} />
          </div>
          <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 10, color: T.inkSoft, marginTop: 6 }}>{progressPct}% · {chapterIdx + 1} de {BOOK.length}</div>
        </div>
      </div>

      {sidebarOpen && !isDesktop && <div onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 30 }} />}

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 16px", borderBottom: `1px solid ${T.line}`, gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {!isDesktop && <button onClick={() => setSidebarOpen(true)} style={iconBtn}><Icon path={ICONS.menu} size={16} /></button>}
            {view === "reader" && <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 11, color: T.inkSoft }}>{chapter.num ? `Capítulo ${chapter.num} de 15` : "Introducción"}</div>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {view === "reader" && (
              <button onClick={() => toggleBookmark(chapter.id)} style={iconBtn} title="Guardar marcador">
                <Icon path={bookmarks.includes(chapter.id) ? ICONS.bookmarkFilled : ICONS.bookmark} size={15} color={bookmarks.includes(chapter.id) ? T.gold : T.ink} />
              </button>
            )}
            <button onClick={() => setFontKey((k) => (k === "s" ? "s" : k === "m" ? "s" : k === "l" ? "m" : "l"))} style={iconBtn} title="Reducir texto"><Icon path={ICONS.minus} size={14} /></button>
            <button onClick={() => setFontKey((k) => (k === "xl" ? "xl" : k === "l" ? "xl" : k === "m" ? "l" : "m"))} style={iconBtn} title="Aumentar texto"><Icon path={ICONS.plus} size={14} /></button>
            <button onClick={() => setThemeName((t) => (t === "light" ? "dark" : "light"))} style={iconBtn} title="Cambiar tema">
              <Icon path={themeName === "light" ? ICONS.moon : ICONS.sun} size={14} />
            </button>
          </div>
        </div>

        <div ref={contentRef} onScroll={onScroll} style={{ flex: 1, overflowY: "auto" }}>
          {view === "home" ? <HomeView T={T} onStart={() => goToChapter(chapterIdx)} onChapter={goToChapter} chapterIdx={chapterIdx} /> : <ReaderView chapter={chapter} T={T} fontSize={FONT_SIZES[fontKey]} />}
        </div>

        {view === "reader" && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 18px", borderTop: `1px solid ${T.line}`, gap: 10 }}>
            <button disabled={chapterIdx === 0} onClick={() => goToChapter(Math.max(0, chapterIdx - 1))} style={{ ...navBtn, opacity: chapterIdx === 0 ? 0.35 : 1 }}>
              <Icon path={ICONS.chevLeft} size={14} /> Anterior
            </button>
            <div style={{ height: 4, flex: 1, margin: "0 10px", background: T.line, borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${progressPct}%`, background: T.gold }} />
            </div>
            <button disabled={chapterIdx === BOOK.length - 1} onClick={() => goToChapter(Math.min(BOOK.length - 1, chapterIdx + 1))} style={{ ...navBtn, opacity: chapterIdx === BOOK.length - 1 ? 0.35 : 1 }}>
              Siguiente <Icon path={ICONS.chevRight} size={14} />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function HomeView({ T, onStart, onChapter, chapterIdx }) {
  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "56px 24px 60px 24px" }}>
      <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 11, letterSpacing: "0.2em", textTransform: "uppercase", color: T.gold }}>Edición ilustrada</div>
      <h1 style={{ fontFamily: "Georgia, serif", fontWeight: 900, fontSize: 42, lineHeight: 1.02, margin: "12px 0 0 0" }}>Expande<br />Tu <span style={{ color: T.gold }}>Mente</span></h1>
      <p style={{ fontFamily: "Georgia, serif", fontStyle: "italic", color: T.inkSoft, fontSize: 15, marginTop: 12 }}>Aprende como realmente aprende tu cerebro.</p>
      <button onClick={onStart} style={{ marginTop: 26, background: T.gold, color: "#1B1712", border: "none", borderRadius: 10, padding: "13px 22px", fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 13.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
        {chapterIdx > 0 ? <><Icon path={ICONS.reset} size={14} /> Continuar leyendo</> : "Empezar a leer"}
      </button>
      <div style={{ marginTop: 44, borderTop: `1px solid ${T.line}`, paddingTop: 22 }}>
        <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: T.inkSoft, marginBottom: 12 }}>Contenido</div>
        {BOOK.map((c, i) => (
          <button key={c.id} onClick={() => onChapter(i)} style={{ display: "flex", width: "100%", alignItems: "baseline", gap: 12, padding: "10px 4px", background: "transparent", border: "none", borderBottom: `1px dotted ${T.line}`, cursor: "pointer", color: T.ink, textAlign: "left" }}>
            <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: T.gold, width: 24, fontSize: 13 }}>{c.num ? String(c.num).padStart(2, "0") : "—"}</span>
            <span style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, flex: 1 }}>{c.title}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function ReaderView({ chapter: c, T, fontSize }) {
  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "42px 24px 90px 24px" }}>
      <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 10.5, letterSpacing: "0.14em", textTransform: "uppercase", color: T.gold }}>{c.tag}</div>
      <h1 style={{ fontFamily: "Georgia, serif", fontWeight: 900, fontSize: 30, lineHeight: 1.08, margin: "10px 0 0 0" }}>{c.title}</h1>
      {c.subtitle && <p style={{ fontFamily: "Georgia, serif", fontStyle: "italic", color: T.inkSoft, fontSize: 14.5, marginTop: 8 }}>{c.subtitle}</p>}
      {c.hook && <p style={{ fontFamily: "Georgia, serif", fontStyle: "italic", color: T.inkSoft, fontSize: 13.5, borderTop: `1px solid ${T.line}`, paddingTop: 14, marginTop: 20 }}>"{c.hook}"</p>}
      <div style={{ fontSize, lineHeight: 1.72, marginTop: 22 }}>
        {c.paragraphs && c.paragraphs.map((p, i) => <p key={i} style={{ margin: "0 0 1em 0" }}>{p}</p>)}
        {c.pullquote && (
          <div style={{ background: T.bg2, borderLeft: `3px solid ${T.gold}`, borderRadius: 3, padding: "14px 18px", margin: "20px 0" }}>
            <p style={{ fontStyle: "italic", margin: 0, fontSize: fontSize + 1 }}>"{c.pullquote}"</p>
          </div>
        )}
        {c.sections && c.sections.map((s, i) => (
          <div key={i}>
            <h3 style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: T.gold, fontSize: fontSize + 5, marginTop: "1.4em", marginBottom: ".4em" }}>{s.h}</h3>
            {s.p.map((p, j) => <p key={j} style={{ margin: "0 0 1em 0" }}>{p}</p>)}
          </div>
        ))}
        {c.steps && (
          <div style={{ marginTop: 18 }}>
            {c.steps.map((s) => (
              <div key={s.n} style={{ display: "flex", gap: 14, marginBottom: 16 }}>
                <div style={{ fontFamily: "Georgia, serif", fontWeight: 900, fontSize: fontSize + 8, color: T.gold, width: 36 }}>{s.n}</div>
                <div>
                  <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: fontSize + 2 }}>{s.t}</div>
                  <div style={{ fontFamily: "system-ui, sans-serif", fontSize: fontSize - 3, color: T.inkSoft, marginTop: 2 }}>{s.d}</div>
                </div>
              </div>
            ))}
          </div>
        )}
        {c.exercise && (
          <div style={{ border: `1.5px dashed ${T.gold}`, borderRadius: 10, padding: "16px 18px", margin: "20px 0", background: T.bg2 + "80" }}>
            <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: fontSize - 3, color: T.gold, marginBottom: 8, textTransform: "uppercase", letterSpacing: ".04em" }}>✎ Ejercicio — {c.exercise.title}</div>
            <ul style={{ margin: 0, paddingLeft: 18 }}>
              {c.exercise.items.map((it, i) => <li key={i} style={{ fontFamily: "system-ui, sans-serif", fontSize: fontSize - 3, color: T.inkSoft, marginBottom: 6, lineHeight: 1.5 }}>{it}</li>)}
            </ul>
          </div>
        )}
        {c.keyidea && (
          <div style={{ background: T.ink, color: T.bg, borderRadius: 10, padding: "16px 20px", margin: "20px 0" }}>
            <div style={{ fontFamily: "system-ui, sans-serif", fontWeight: 800, fontSize: 9.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.gold }}>{typeof c.keyidea === "object" ? c.keyidea.label : "Idea clave"}</div>
            <p style={{ fontFamily: "Georgia, serif", fontStyle: "italic", fontWeight: 700, fontSize: fontSize + 1, margin: "6px 0 0 0" }}>"{typeof c.keyidea === "object" ? c.keyidea.text : c.keyidea}"</p>
          </div>
        )}
        {c.closing && <p style={{ margin: "1em 0 0 0" }}>{c.closing}</p>}
        {c.teaser && (
          <div style={{ marginTop: 24, paddingTop: 14, borderTop: `1px solid ${T.line}`, fontFamily: "system-ui, sans-serif", fontSize: fontSize - 4, color: T.inkSoft }}>
            <b style={{ color: T.ink }}>Sigue leyendo →</b> {c.teaser}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
